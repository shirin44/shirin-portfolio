<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Shirin Shujaa</title>
  <meta http-equiv="refresh" content="4; url=/shirin-portfolio/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0ea;
      font-family: system-ui, sans-serif;
    }
    .box {
      background: #fff;
      border: 2px solid rgba(0,0,0,.10);
      border-radius: 18px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
      max-width: 420px;
      width: 90%;
    }
    .code {
      font-size: 72px;
      font-weight: 900;
      color: #8E494B;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .msg {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #222E45;
    }
    .sub {
      margin-top: 8px;
      font-size: 14px;
      color: rgba(0,0,0,.50);
    }
    .link {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 24px;
      background: #222E45;
      color: #fff;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: .04em;
      transition: opacity 140ms;
    }
    .link:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="msg">Page not found</div>
    <div class="sub">Redirecting you back in a moment…</div>
    <a class="link" href="/shirin-portfolio/">Go home →</a>
  </div>
</body>
</html>
